services:
  - type: web
    name: control-interno-ecobus
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:

        - key: PYTHON_VERSION
        value: 3.12.8

        
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_DISPLAY_NAME
        value: Administrador Ecobus

      - key: MAPBOX_TOKEN
        sync: false
